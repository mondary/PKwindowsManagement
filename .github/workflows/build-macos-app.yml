name: Build macOS app

on:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'src/macos/**'
      - 'src/script/package_app.sh'
      - 'Package.swift'
      - '.github/workflows/build-macos-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode toolchain
        run: |
          xcode-select -p
          swift --version
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPMENT_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/developer-cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/developer-cert.p12"
      - name: Build app bundle
        # Test builds are dev builds: same code, labeled -dev.
        run: PK_DEV_BUILD=1 src/script/package_app.sh release
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/PKwindowsManagement.app PKwindowsManagement.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PKwindowsManagement-macos
          path: PKwindowsManagement.app.zip
          if-no-files-found: error
          retention-days: 7
